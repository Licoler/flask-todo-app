
name: Flask CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "Werkzeug==0.16.1" "SQLAlchemy==1.3.24" "MarkupSafe==1.1.1"

      - name: Validate Python code
        run: |
          python -m compileall -q application manage.py

      - name: Initialize SQLite database
        run: |
          python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          python manage.py runserver &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in {1..15}; do
            if curl --fail http://127.0.0.1:7345/; then
              echo "Flask server is working!"
              exit 0
            fi
            sleep 2
          done

          echo "Flask server failed to start"
          exit 1
